controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    gripper_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    visual_controller:
      type: ex5/VisualController

gripper_position_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - fr3_finger_joint1
      - fr3_finger_joint2

visual_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    root_link: "base"
    tip_link: "fr3_hand_tcp"
    optical_link: "fr3_camera_link_optical" # what could this be for?
    marker_approach_height: -0.05
    p_gains:  # you can modify the gains here
      - 1.4
      - 1.4
      - 1.4
      - 1.4
      - 1.4
      - 1.4
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0 