controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    hand_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    visual_controller:
      type: ex5/VisualController
      
hand_controller:
  ros__parameters:
    joint: fr3_finger_joint1

visual_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    root_link: "base"
    tip_link: "fr3_hand_tcp"
    optical_link: "fr3_camera_link_optical" # what could this be for?
    marker_approach_height: 0.0
    p_gains:  # you can modify the gains here
      - 1.4
      - 1.4
      - 1.4
      - 1.4
      - 1.4
      - 1.4
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0 